name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint (real table query)
        run: |
          response=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            "https://wkpqrkwjmtvpaswvjdly.supabase.co/rest/v1/kv_store?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $response"
          cat /tmp/resp.json
          if [ "$response" -ne 200 ]; then
            echo "::error::Expected HTTP 200 from a real table query, got $response"
            exit 1
          fi
